name: Windows build and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build tools and Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 cmake==3.31.6 ninja==1.11.1.3
          python -m aqt install-qt windows desktop 6.10.2 win64_msvc2022_64 -O C:/Qt -m qt5compat qtmultimedia qtshadertools
          "QT_ROOT=C:/Qt/6.10.2/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build, test, install and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JianpuLab-Windows-x64
          path: |
            artifacts/JianpuLab-Release-win64.zip
            artifacts/JianpuLab-source.tar.gz
            artifacts/JianpuLab-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-test-logs
          path: build/windows-release/Testing/Temporary/
